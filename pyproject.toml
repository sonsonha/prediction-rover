[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "landfill-rover-prediction-core"
version = "0.1.0"
description = "Prediction Python V1: ROS-independent collision and rollover evidence"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "shapely>=2.0",
  "PyYAML>=6.0",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[tool.pytest.ini_options]
testpaths = ["tests", "ros2/prediction_ros/test"]
pythonpath = ["ros2/prediction_ros"]
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["prediction_core*", "mock*", "visualization*"]

